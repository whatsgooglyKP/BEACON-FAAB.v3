# Baseline = what Beacon ships today, plus the candidate Gemini write-up feature.
# Every experiment file changes exactly ONE factor relative to this file.
name: baseline
seed: 20261111            # fixed seed for Monte Carlo draws and Gemini sampling
ranking:
  variant: screening_v1   # app/src/domain.js candidates(), straight-line lens
  weights: {poverty: 1.0, lila: 0.0, snap_shortfall: 0.0}
confidence:
  variant: pipeline_v1    # shipped High/Medium/Low rule
writeup:
  enabled: true
  prompt_version: v1
  model: gemini-3.1-flash-lite   # gemini-3-flash-preview hit its free-tier daily quota on 11/11/2026
  temperature: 1.0
  top_k: 10               # write-ups for the top 10 tracts
  repeats: 2              # same seed twice -> checks output consistency
stability:
  draws: 500              # Monte Carlo redraws inside the ACS margins of error
